<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hema Prasad Dogga | ECE, RISC-V & AIoT Portfolio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="https://js.puter.com/v2/"></script>
  
  <style>
    :root {
      --bg: #060a12;
      --card-bg: rgba(10, 17, 30, 0.88);
      --card-border: rgba(0, 212, 255, 0.22);
      --primary: #00d4ff;
      --primary-glow: #38bdf8;
      --accent: #10b981;
      --whatsapp: #25d366;
      --text: #f0f6fc;
      --text-muted: #8b9bb4;
      --font-sans: 'Inter', sans-serif;
      --font-mono: 'JetBrains Mono', monospace;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      scroll-behavior: smooth;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: var(--font-sans);
      line-height: 1.6;
      overflow-x: hidden;
      position: relative;
    }

    /* Dedicated Fullscreen Logic Gates & PCB Canvas */
    #pcb-canvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: 0;
      pointer-events: none;
      background: radial-gradient(circle at 65% 35%, #0d1b2f 0%, #060a12 100%);
    }

    .site-wrapper {
      position: relative;
      z-index: 1;
    }

    /* Navbar */
    nav {
      position: fixed;
      top: 0;
      width: 100%;
      background: rgba(6, 10, 18, 0.85);
      backdrop-filter: blur(16px);
      border-bottom: 1px solid rgba(0, 212, 255, 0.15);
      z-index: 1000;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 1.1rem 10%;
    }

    .logo {
      font-family: var(--font-mono);
      font-size: 1.2rem;
      font-weight: 700;
      color: var(--primary);
      text-shadow: 0 0 12px rgba(0, 212, 255, 0.6);
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .nav-links {
      display: flex;
      gap: 1.75rem;
      list-style: none;
    }

    .nav-links a {
      color: var(--text-muted);
      text-decoration: none;
      font-size: 0.92rem;
      font-weight: 500;
      transition: all 0.2s;
    }

    .nav-links a:hover {
      color: var(--primary);
      text-shadow: 0 0 8px var(--primary);
    }

    .container {
      max-width: 1140px;
      margin: 0 auto;
      padding: 0 1.5rem;
    }

    section {
      padding: 5.5rem 0;
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
    }

    /* Hero Section */
    .hero {
      min-height: 95vh;
      display: flex;
      align-items: center;
      padding-top: 5rem;
    }

    .hero-container {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 3.5rem;
      width: 100%;
    }

    .hero-content {
      flex: 1;
      max-width: 650px;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      background: rgba(0, 212, 255, 0.1);
      color: var(--primary);
      border: 1px solid rgba(0, 212, 255, 0.35);
      padding: 0.4rem 1.1rem;
      border-radius: 999px;
      font-size: 0.85rem;
      font-family: var(--font-mono);
      margin-bottom: 1.5rem;
      box-shadow: 0 0 15px rgba(0, 212, 255, 0.15);
    }

    .hero h1 {
      font-size: 3.3rem;
      font-weight: 800;
      line-height: 1.15;
      margin-bottom: 1.25rem;
      letter-spacing: -0.02em;
    }

    .hero h1 span {
      background: linear-gradient(135deg, #00d4ff 0%, #38bdf8 50%, #10b981 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-shadow: 0 0 25px rgba(0, 212, 255, 0.35);
    }

    .hero p {
      font-size: 1.1rem;
      color: var(--text-muted);
      margin-bottom: 2rem;
    }

    .hero-btns {
      display: flex;
      gap: 1rem;
      flex-wrap: wrap;
    }

    .btn {
      padding: 0.8rem 1.6rem;
      border-radius: 8px;
      font-weight: 600;
      font-size: 0.95rem;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      cursor: pointer;
      border: none;
      transition: all 0.25s ease-in-out;
    }

    .btn-primary {
      background: linear-gradient(135deg, #00d4ff, #0284c7);
      color: #060a12;
      box-shadow: 0 0 20px rgba(0, 212, 255, 0.4);
    }

    .btn-primary:hover {
      box-shadow: 0 0 28px rgba(0, 212, 255, 0.7);
      transform: translateY(-2px);
    }

    .btn-outline {
      background: rgba(10, 17, 30, 0.75);
      color: var(--text);
      border: 1px solid var(--card-border);
      backdrop-filter: blur(8px);
    }

    .btn-outline:hover {
      background: rgba(16, 28, 48, 0.95);
      border-color: var(--primary);
      box-shadow: 0 0 15px rgba(0, 212, 255, 0.25);
      transform: translateY(-2px);
    }

    .btn-ai {
      background: linear-gradient(135deg, rgba(16, 185, 129, 0.2), rgba(0, 212, 255, 0.2));
      border: 1px solid var(--accent);
      color: var(--text);
    }

    .btn-ai:hover {
      background: rgba(16, 185, 129, 0.35);
      box-shadow: 0 0 20px rgba(16, 185, 129, 0.5);
      transform: translateY(-2px);
    }

    /* Profile Frame */
    .hero-photo-wrapper {
      position: relative;
      flex-shrink: 0;
    }

    .profile-glow {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 290px;
      height: 290px;
      background: radial-gradient(circle, rgba(0, 212, 255, 0.45) 0%, rgba(16, 185, 129, 0.2) 50%, transparent 75%);
      border-radius: 50%;
      filter: blur(25px);
      z-index: 0;
      animation: pulseGlow 4s ease-in-out infinite alternate;
    }

    @keyframes pulseGlow {
      0% { transform: translate(-50%, -50%) scale(0.9); opacity: 0.5; }
      100% { transform: translate(-50%, -50%) scale(1.15); opacity: 0.95; }
    }

    .profile-img-container {
      position: relative;
      width: 250px;
      height: 250px;
      border-radius: 50%;
      padding: 5px;
      background: linear-gradient(135deg, #00d4ff 0%, #34d399 100%);
      box-shadow: 0 0 35px rgba(0, 212, 255, 0.45);
      z-index: 1;
    }

    .profile-img {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      object-fit: cover;
      background: #060a12;
      display: block;
      border: 3px solid #060a12;
    }

    .section-title {
      font-size: 1.85rem;
      font-weight: 700;
      margin-bottom: 2.5rem;
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }

    .section-title i {
      color: var(--primary);
      font-size: 1.4rem;
      text-shadow: 0 0 10px rgba(0, 212, 255, 0.5);
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(330px, 1fr));
      gap: 1.5rem;
    }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 1.75rem;
      backdrop-filter: blur(12px);
      transition: all 0.25s ease-in-out;
      position: relative;
    }

    .card-featured {
      border-color: rgba(0, 212, 255, 0.5);
      background: linear-gradient(180deg, rgba(16, 28, 48, 0.95), rgba(10, 17, 30, 0.9));
      box-shadow: 0 0 25px rgba(0, 212, 255, 0.15);
    }

    .card:hover {
      transform: translateY(-5px);
      border-color: rgba(0, 212, 255, 0.6);
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5), 0 0 20px rgba(0, 212, 255, 0.2);
    }

    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 0.75rem;
    }

    .card-title {
      font-size: 1.15rem;
      font-weight: 600;
      color: var(--text);
    }

    .card-meta {
      font-family: var(--font-mono);
      font-size: 0.8rem;
      color: var(--primary);
      margin-bottom: 0.75rem;
    }

    .card-desc {
      color: var(--text-muted);
      font-size: 0.92rem;
      margin-bottom: 1.25rem;
    }

    .tag-list {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
    }

    .tag {
      background: rgba(0, 212, 255, 0.08);
      border: 1px solid rgba(0, 212, 255, 0.2);
      padding: 0.25rem 0.65rem;
      border-radius: 6px;
      font-size: 0.75rem;
      font-family: var(--font-mono);
      color: #7dd3fc;
    }

    .tag-highlight {
      background: rgba(16, 185, 129, 0.15);
      border-color: rgba(16, 185, 129, 0.4);
      color: #6ee7b7;
    }

    .skills-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 1.5rem;
    }

    .skill-box {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 1.6rem;
      backdrop-filter: blur(12px);
    }

    .skill-box h3 {
      font-size: 1rem;
      color: var(--primary);
      margin-bottom: 1.2rem;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    /* Floating Action Buttons */
    .floating-actions {
      position: fixed;
      bottom: 25px;
      right: 25px;
      display: flex;
      flex-direction: column;
      gap: 15px;
      z-index: 1050;
    }

    .float-btn {
      width: 58px;
      height: 58px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      font-size: 1.6rem;
      text-decoration: none;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
      cursor: pointer;
      border: none;
      transition: transform 0.25s, box-shadow 0.25s;
      position: relative;
    }

    .float-btn:hover {
      transform: scale(1.1);
    }

    .float-whatsapp {
      background: var(--whatsapp);
      box-shadow: 0 0 20px rgba(37, 211, 102, 0.5);
    }

    .float-whatsapp:hover {
      box-shadow: 0 0 30px rgba(37, 211, 102, 0.8);
    }

    .float-ai {
      background: linear-gradient(135deg, #00d4ff, #0284c7);
      box-shadow: 0 0 20px rgba(0, 212, 255, 0.5);
    }

    .float-ai:hover {
      box-shadow: 0 0 30px rgba(0, 212, 255, 0.8);
    }

    .badge-tooltip {
      position: absolute;
      right: 70px;
      background: rgba(10, 17, 30, 0.95);
      border: 1px solid var(--card-border);
      color: var(--text);
      font-size: 0.78rem;
      font-family: var(--font-mono);
      padding: 5px 12px;
      border-radius: 6px;
      white-space: nowrap;
      pointer-events: none;
      opacity: 0;
      transform: translateX(10px);
      transition: all 0.2s ease;
    }

    .float-btn:hover .badge-tooltip {
      opacity: 1;
      transform: translateX(0);
    }

    /* AI Assistant Modal */
    .ai-modal {
      position: fixed;
      bottom: 95px;
      right: 25px;
      width: 380px;
      max-width: calc(100vw - 40px);
      height: 500px;
      background: rgba(10, 17, 30, 0.96);
      border: 1px solid var(--card-border);
      border-radius: 16px;
      backdrop-filter: blur(20px);
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.7), 0 0 30px rgba(0, 212, 255, 0.25);
      z-index: 1060;
      display: none;
      flex-direction: column;
      overflow: hidden;
      animation: modalSlide 0.3s ease;
    }

    @keyframes modalSlide {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .ai-modal.active {
      display: flex;
    }

    .ai-header {
      padding: 1rem 1.25rem;
      background: rgba(16, 28, 48, 0.8);
      border-bottom: 1px solid var(--card-border);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .ai-header h4 {
      font-size: 0.95rem;
      color: var(--primary);
      display: flex;
      align-items: center;
      gap: 0.5rem;
      font-family: var(--font-mono);
    }

    .ai-close {
      background: transparent;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      font-size: 1.1rem;
    }

    .ai-body {
      flex: 1;
      padding: 1rem;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
      font-size: 0.88rem;
    }

    .ai-msg {
      padding: 0.65rem 0.9rem;
      border-radius: 10px;
      max-width: 88%;
      line-height: 1.45;
      white-
